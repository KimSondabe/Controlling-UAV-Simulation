<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="100%" height="100%" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="760" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Drone Simulation &amp; Control Architecture Workflow</text>

  <!-- ROS 2 Humble Outer Container -->
  <rect x="980" y="125" width="380" height="605" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1000" y="152" font-size="15" font-weight="700" fill="#15803d">ROS 2 HUMBLE</text>

  <!-- 1. Gazebo Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="300" height="195" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="190" y="112" font-size="18" font-weight="700" text-anchor="middle" fill="#0369a1">Gazebo (Simulation)</text>
    <line x1="65" y1="126" x2="315" y2="126" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="60" y="152" font-size="13.5" fill="#0f172a">• Custom 3D virtual drone world</text>
    <text x="60" y="177" font-size="13.5" fill="#0f172a">• Rigid-body physics &amp; aerodynamics</text>
    <text x="60" y="202" font-size="13.5" fill="#0f172a">• Virtual sensors: IMU, GPS,</text>
    <text x="72" y="222" font-size="13.5" fill="#0f172a">barometer &amp; cameras</text>
  </g>

  <!-- 2. QGroundControl Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="475" width="300" height="195" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="190" y="507" font-size="18" font-weight="700" text-anchor="middle" fill="#b45309">QGroundControl (GCS)</text>
    <line x1="65" y1="521" x2="315" y2="521" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="60" y="547" font-size="13.5" fill="#0f172a">• Pilot / operator dashboard</text>
    <text x="60" y="572" font-size="13.5" fill="#0f172a">• Live flight telemetry display</text>
    <text x="60" y="597" font-size="13.5" fill="#0f172a">• Mission planning &amp; waypoints</text>
    <text x="60" y="622" font-size="13.5" fill="#0f172a">• Parameter tuning &amp; manual control</text>
  </g>

  <!-- 3. PX4-Autopilot Box -->
  <g filter="url(#shadow)">
    <rect x="440" y="260" width="260" height="225" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
    <text x="570" y="294" font-size="18" font-weight="700" text-anchor="middle" fill="#5b21b6">PX4-Autopilot</text>
    <line x1="465" y1="308" x2="675" y2="308" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="460" y="335" font-size="13.5" fill="#0f172a">• Flight control firmware</text>
    <text x="460" y="362" font-size="13.5" fill="#0f172a">• State estimation (EKF2)</text>
    <text x="460" y="389" font-size="13.5" fill="#0f172a">• PID attitude &amp; position loops</text>
    <text x="460" y="416" font-size="13.5" fill="#0f172a">• Flight mode logic &amp; safety</text>
    <text x="460" y="443" font-size="13.5" fill="#0f172a">• Fundamental flight data</text>
  </g>

  <!-- 4. MicroXRCEAgent Box -->
  <g filter="url(#shadow)">
    <rect x="765" y="310" width="150" height="125" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
    <text x="840" y="346" font-size="15.5" font-weight="700" text-anchor="middle" fill="#334155">MicroXRCEAgent</text>
    <text x="840" y="370" font-size="13" font-weight="600" text-anchor="middle" fill="#475569">(DDS Middleware)</text>
    <line x1="785" y1="384" x2="895" y2="384" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="840" y="408" font-size="12.5" text-anchor="middle" fill="#334155">uORB ↔ ROS 2</text>
    <text x="840" y="425" font-size="12.5" text-anchor="middle" fill="#334155">Topic Bridge</text>
  </g>

  <!-- 5. Human Operator Box -->
  <g filter="url(#shadow)">
    <rect x="1030" y="20" width="290" height="75" rx="37" fill="#ffe4e6" stroke="#e11d48" stroke-width="2.5"/>
    <text x="1175" y="53" font-size="16" font-weight="700" text-anchor="middle" fill="#be123c">Human Operator</text>
    <text x="1175" y="75" font-size="13" text-anchor="middle" fill="#0f172a">Continuous manual control input</text>
  </g>

  <!-- 6. Control Node Box -->
  <g filter="url(#shadow)">
    <rect x="1020" y="170" width="310" height="135" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <text x="1175" y="200" font-size="17" font-weight="700" text-anchor="middle" fill="#166534">Control Node</text>
    <line x1="1045" y1="213" x2="1305" y2="213" stroke="#86efac" stroke-width="1.5"/>
    <text x="1040" y="238" font-size="13.5" fill="#0f172a">• Receives drone status from PX4</text>
    <text x="1040" y="262" font-size="13.5" fill="#0f172a">• Reads continuous human signals</text>
    <text x="1040" y="286" font-size="13.5" fill="#0f172a">• Sends flight commands back to PX4</text>
  </g>

  <!-- 7. px4-to-odom Node Box -->
  <g filter="url(#shadow)">
    <rect x="1020" y="365" width="310" height="135" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <text x="1175" y="395" font-size="17" font-weight="700" text-anchor="middle" fill="#166534">px4-to-odom Node</text>
    <line x1="1045" y1="408" x2="1305" y2="408" stroke="#86efac" stroke-width="1.5"/>
    <text x="1040" y="433" font-size="13.5" fill="#0f172a">• Subscribes to PX4 state messages</text>
    <text x="1040" y="457" font-size="13.5" fill="#0f172a">• Computes coordinates, position,</text>
    <text x="1052" y="477" font-size="13.5" fill="#0f172a">&amp; orientation (direction)</text>
  </g>

  <!-- 8. RViz2 Box -->
  <g filter="url(#shadow)">
    <rect x="1020" y="565" width="310" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <text x="1175" y="595" font-size="17" font-weight="700" text-anchor="middle" fill="#166534">RViz2 (Visualization)</text>
    <line x1="1045" y1="608" x2="1305" y2="608" stroke="#86efac" stroke-width="1.5"/>
    <text x="1040" y="635" font-size="13.5" fill="#0f172a">• Displays drone pose &amp; coordinates</text>
    <text x="1040" y="660" font-size="13.5" fill="#0f172a">• Draws live 3D flight trajectory</text>
  </g>

  <!-- ARROWS & LABELS -->

  <!-- Gazebo -> PX4 -->
  <path d="M 340 140 L 535 140 L 535 256" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="370" y="120" width="145" height="22" rx="4" fill="#f8fafc"/>
  <text x="442" y="135" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0369a1">Virtual Sensor Data</text>

  <!-- PX4 -> Gazebo -->
  <path d="M 490 260 L 490 205 L 344 205" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="360" y="212" width="122" height="22" rx="4" fill="#f8fafc"/>
  <text x="421" y="227" font-size="12.5" font-weight="600" text-anchor="middle" fill="#5b21b6">Actuator Commands</text>

  <!-- PX4 -> QGroundControl -->
  <path d="M 535 485 L 535 535 L 344 535" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="365" y="515" width="145" height="22" rx="4" fill="#f8fafc"/>
  <text x="437" y="530" font-size="12.5" font-weight="600" text-anchor="middle" fill="#5b21b6">Telemetry &amp; Status</text>

  <!-- QGroundControl -> PX4 -->
  <path d="M 340 605 L 590 605 L 590 489" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <rect x="360" y="612" width="195" height="22" rx="4" fill="#f8fafc"/>
  <text x="457" y="627" font-size="12.5" font-weight="600" text-anchor="middle" fill="#b45309">Missions, Tuning &amp; Manual Ctrl</text>

  <!-- PX4 <-> MicroXRCEAgent -->
  <path d="M 700 345 L 761 345" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="732" y="336" font-size="12" font-weight="600" text-anchor="middle" fill="#5b21b6">Status</text>

  <path d="M 765 400 L 704 400" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="734" y="418" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Setpoints</text>

  <!-- MicroXRCEAgent -> Control Node -->
  <path d="M 820 310 L 820 208 L 1016 208" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="835" y="186" width="132" height="22" rx="4" fill="#f8fafc"/>
  <text x="901" y="201" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">Drone Status &amp; Info</text>

  <!-- Control Node -> MicroXRCEAgent -->
  <path d="M 1020 265 L 865 265 L 865 306" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="875" y="272" width="115" height="22" rx="4" fill="#f8fafc"/>
  <text x="932" y="287" font-size="12.5" font-weight="600" text-anchor="middle" fill="#166534">Control Commands</text>

  <!-- MicroXRCEAgent -> px4-to-odom -->
  <path d="M 915 415 L 1016 415" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <rect x="920" y="388" width="90" height="20" rx="4" fill="#f8fafc"/>
  <text x="965" y="402" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Pose / State</text>

  <!-- Human Operator -> Control Node -->
  <path d="M 1175 95 L 1175 166" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <rect x="1080" y="110" width="190" height="22" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
  <text x="1175" y="125" font-size="12.5" font-weight="600" text-anchor="middle" fill="#be123c">Continuous Control Signals</text>

  <!-- px4-to-odom -> RViz2 -->
  <path d="M 1175 500 L 1175 561" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="1075" y="518" width="200" height="22" rx="4" fill="#f0fdf4"/>
  <text x="1175" y="533" font-size="12.5" font-weight="600" text-anchor="middle" fill="#166534">Odometry, TF &amp; Trajectory Path</text>
</svg>